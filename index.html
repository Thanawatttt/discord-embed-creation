<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Embed Builder - Liquid Grass</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Base & fonts */
body {
    font-family: 'Noto Sans Thai', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(270deg, #1e2a1f, #2a3a2f, #1e2a1f);
    background-size: 600% 600%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
}

@keyframes gradientBG {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

h1 {
    margin-top: 20px;
    font-size: 2em;
    text-align: center;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
}

/* Container */
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px;
    width: 100%;
    max-width: 1200px;
}

/* Sections */
.form-section, .preview-section {
    background: rgba(0,0,0,0.5);
    border-radius: 15px;
    padding: 20px;
    margin: 10px;
    flex: 1 1 400px;
    min-width: 350px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    transition: transform 0.3s, background 0.3s;
}

.form-section:hover, .preview-section:hover {
    transform: translateY(-5px);
    background: rgba(0,0,0,0.7);
}

/* Inputs & buttons */
input, textarea, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans Thai', sans-serif;
}

textarea {
    resize: vertical;
    min-height: 100px;
    background: #1f1f2d;
    color: #fff;
}

button {
    background: linear-gradient(90deg,#00ff88,#00ffaa);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(90deg,#00ffaa,#00ff88);
}

label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
}

/* Embed preview */
.embed-preview {
    background: rgba(35,39,42,0.9);
    border-left: 6px solid #00ff88;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    overflow-wrap: break-word;
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
}

.embed-title { font-weight: bold; font-size: 1.3em; margin-bottom: 8px; color:#00ff88;}
.embed-description { margin-bottom: 10px; white-space: pre-wrap; }
.embed-footer, .embed-author, .embed-timestamp { font-size: 0.8em; color:#bbbbbb; }
.embed-image { max-width:100%; border-radius:8px; margin-top:8px; }

/* Color row */
.color-row { display:flex; align-items:center; }
.color-row input[type="color"] { margin-left:10px; cursor:pointer; height:40px; width:60px; }
</style>
</head>
<body>

<h1>Discord Embed Builder - Liquid Grass</h1>

<div class="container">
<div class="form-section">
    <label>Webhook URL</label>
    <input type="text" id="webhookUrl" placeholder="วาง Discord Webhook URL ของคุณ">

    <label>Title</label>
    <input type="text" id="embedTitle" placeholder="Title ของ Embed" oninput="updatePreview()">

    <label>Description</label>
    <textarea id="embedDescription" placeholder="ข้อความของ Embed" oninput="updatePreview()"></textarea>

    <label>Color</label>
    <div class="color-row">
        <span>เลือกสี:</span>
        <input type="color" id="embedColor" value="#00ff88" onchange="updatePreview()">
    </div>

    <label>Image URL</label>
    <input type="text" id="embedImage" placeholder="URL ของรูปภาพ" oninput="updatePreview()">

    <label>Footer Text</label>
    <input type="text" id="embedFooter" placeholder="ข้อความ Footer" oninput="updatePreview()">

    <label>Author</label>
    <input type="text" id="embedAuthor" placeholder="Author Name" oninput="updatePreview()">

    <button onclick="sendWebhook()">Send Embed</button>
</div>

<div class="preview-section">
    <h2>Realtime Preview</h2>
    <div id="preview" class="embed-preview">
        <div id="previewAuthor" class="embed-author"></div>
        <div id="previewTitle" class="embed-title"></div>
        <div id="previewDescription" class="embed-description"></div>
        <img id="previewImage" class="embed-image">
        <div id="previewFooter" class="embed-footer"></div>
        <div id="previewTimestamp" class="embed-timestamp"></div>
    </div>
</div>
</div>

<script>
function updatePreview() {
    document.getElementById('previewTitle').innerText = document.getElementById('embedTitle').value;
    document.getElementById('previewDescription').innerText = document.getElementById('embedDescription').value;
    document.getElementById('previewImage').src = document.getElementById('embedImage').value || '';
    document.getElementById('previewFooter').innerText = document.getElementById('embedFooter').value;
    document.getElementById('previewAuthor').innerText = document.getElementById('embedAuthor').value;
    document.getElementById('previewTimestamp').innerText = new Date().toLocaleString();
    document.getElementById('preview').style.borderLeftColor = document.getElementById('embedColor').value;
}

async function sendWebhook() {
    const webhookUrl = document.getElementById('webhookUrl').value;
    if(!webhookUrl) return alert("กรุณาใส่ Webhook URL!");

    const embed = {
        title: document.getElementById('embedTitle').value,
        description: document.getElementById('embedDescription').value,
        color: parseInt(document.getElementById('embedColor').value.replace('#',''),16),
        timestamp: new Date(),
        footer: { text: document.getElementById('embedFooter').value },
        author: { name: document.getElementById('embedAuthor').value },
        image: { url: document.getElementById('embedImage').value }
    };

    try {
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ embeds:[embed] })
        });
        if(response.ok) alert("ส่ง Embed เรียบร้อย!");
        else alert("เกิดข้อผิดพลาด: "+response.statusText);
    } catch(err){
        alert("เกิดข้อผิดพลาด: "+err);
    }
}

// Initial preview
updatePreview();
</script>

</body>
</html>
